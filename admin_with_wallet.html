
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Админ-панель Tao NFT</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: sans-serif;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
    }
    #wallet {
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #444;
      padding: 6px;
      text-align: center;
    }
    th {
      background: #222;
    }
    tr:nth-child(even) {
      background-color: #1a1a1a;
    }
    button {
      padding: 6px 10px;
      cursor: pointer;
    }
    #saveBtn {
      margin-top: 20px;
      background: #00cc66;
      color: white;
      border: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Админ-панель NFT пикселей</h1>

  <div id="wallet">
    <button onclick="connectWallet()">🔌 Подключить Metamask</button>
    <span id="walletAddress"></span>
  </div>

  <table id="pixelTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>X</th>
        <th>Y</th>
        <th>Редкость</th>
        <th>Статус</th>
        <th>Владелец</th>
        <th>Отметить как продано</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <button id="saveBtn" onclick="saveChanges()">💾 Сохранить изменения</button>

  <script>
    const ADMIN_WALLET = "0xCCd86a51D8Fb4212E4D18202C14E8b57dcd571C2"; // заменим позже на реальный адрес
    let currentAccount = "";
    let statusData = {};

    async function connectWallet() {
      if (window.ethereum) {
        try {
          const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
          currentAccount = accounts[0];
          document.getElementById("walletAddress").innerText = "🟢 " + currentAccount;
          if (currentAccount.toLowerCase() !== ADMIN_WALLET.toLowerCase()) {
            alert("Нет доступа. Вы не администратор.");
            document.body.innerHTML = "<h2>⛔ Доступ запрещён</h2>";
            return;
          }
          loadPixels();
        } catch (err) {
          console.error("Ошибка:", err);
        }
      } else {
        alert("Metamask не найден.");
      }
    }

    function loadPixels() {
      fetch("pixel_status.json")
        .then(res => res.json())
        .then(data => {
          statusData = data;
          const tbody = document.querySelector("#pixelTable tbody");
          tbody.innerHTML = "";

          for (const id in statusData) {
            const px = statusData[id];
            const row = document.createElement("tr");

            row.innerHTML = `
              <td>${id}</td>
              <td>${px.x}</td>
              <td>${px.y}</td>
              <td>${px.rarity}</td>
              <td>${px.status}</td>
              <td>${px.owner || "-"}</td>
              <td><input type="checkbox" data-id="${id}" ${px.status === "sold" ? "checked" : ""}></td>
            `;

            tbody.appendChild(row);
          }
        });
    }

    function saveChanges() {
      const checkboxes = document.querySelectorAll("input[type=checkbox]");
      checkboxes.forEach(cb => {
        const id = cb.getAttribute("data-id");
        if (cb.checked) {
          statusData[id].status = "sold";
          if (!statusData[id].owner) statusData[id].owner = currentAccount;
        } else {
          statusData[id].status = "available";
          statusData[id].owner = "";
        }
      });

      const blob = new Blob([JSON.stringify(statusData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "pixel_status.json";
      a.click();
      URL.revokeObjectURL(url);
      alert("Изменения сохранены. Замените файл pixel_status.json на сервере.");
    }
  </script>
</body>
</html>
