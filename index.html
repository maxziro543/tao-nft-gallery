
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tao NFT Gallery</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 1rem;
    }
    canvas {
      border: 1px solid #444;
      margin-top: 1rem;
    }
    #controls {
      margin-bottom: 1rem;
    }
    button {
      margin: 0 0.5rem;
      padding: 0.5rem 1rem;
      background-color: #333;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <h1>Tao NFT Gallery (Demo)</h1>
  <p>Полотно из NFT-пикселей, загруженных из IPFS</p>
  <div id="controls">
    <button onclick="filterRarity('all')">Все</button>
    <button onclick="filterRarity('common')">Обычные</button>
    <button onclick="filterRarity('rare')">Редкие</button>
    <button onclick="filterRarity('epic')">Эпические</button>
  </div>
  <canvas id="canvas" width="256" height="256" style="width:512px; height:512px;"></canvas>
  <canvas id="overlay" width="256" height="256" style="position:absolute; left:0; top:170px; width:512px; height:512px; pointer-events:none;"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const overlay = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const overlayCtx = overlay.getContext('2d');
    const pixelSize = 2;

    let pixelStatus = {};
    let rarityFilter = 'all';

    async function fetchPixelStatus() {
      const response = await fetch('pixel_status.json');
      pixelStatus = await response.json();
    }

    async function drawCanvas() {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = "https://gateway.pinata.cloud/ipfs/bafkreiehhhdw42a7saeshoiazhpq55246qq5hhflwvdfbrfzvum3nj3nqu";
      img.onload = () => {
        ctx.drawImage(img, 0, 0);
        applyOverlay();
      };
    }

    function applyOverlay() {
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      for (let y = 0; y < 256; y++) {
        for (let x = 0; x < 256; x++) {
          const index = y * 256 + x;
          const status = pixelStatus[index] || {};
          const rarity = status.rarity || 'common';

          if (rarityFilter !== 'all' && rarity !== rarityFilter) {
            overlayCtx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            overlayCtx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
          }
        }
      }
    }

    function filterRarity(rarity) {
      rarityFilter = rarity;
      applyOverlay();
    }

    (async () => {
      await fetchPixelStatus();
      await drawCanvas();
    })();
  </script>
</body>
</html>
