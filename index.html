
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tao NFT Gallery</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
    }
    #main {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: url('tao_nft_canvas_full.png') center center no-repeat;
      background-size: contain;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(256, 1fr);
      grid-template-rows: repeat(256, 1fr);
    }
    .pixel {
      width: 100%;
      height: 100%;
      cursor: pointer;
      opacity: 0;
    }
    .filtered {
      opacity: 0.08 !important;
    }
    .highlight {
      outline: 1px solid rgba(255,255,255,0.2);
    }
    .controls {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 8px;
      color: white;
      font-family: sans-serif;
    }
    .controls button {
      margin: 0 4px 4px 0;
      padding: 5px 10px;
      background: #333;
      border: none;
      color: white;
      cursor: pointer;
    }
    .controls button:hover {
      background: #555;
    }
  </style>
</head>
<body>
<div class="controls">
  <button onclick="setFilter('all')">Все</button>
  <button onclick="setFilter('common')">Обычные</button>
  <button onclick="setFilter('rare')">Редкие</button>
  <button onclick="setFilter('epic')">Эпические</button>
  <button onclick="setFilter('mine')">Мои пиксели</button>
  <button onclick="connectWallet()">🔌 Подключить кошелек</button>
</div>
<div id="main">
  <div id="overlay"></div>
</div>

<script>
  const overlay = document.getElementById("overlay");
  let filter = 'all';
  let pixelStatus = {};
  let walletAddress = null;

  async function connectWallet() {
    if (window.ethereum) {
      try {
        const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
        walletAddress = accounts[0].toLowerCase();
        alert('Кошелек подключен: ' + walletAddress);
        render();
      } catch (e) {
        alert("Ошибка подключения к Metamask");
      }
    } else {
      alert("Установите Metamask");
    }
  }

  function setFilter(f) {
    filter = f;
    render();
  }

  function render() {
    overlay.innerHTML = "";
    for (let i = 0; i < 256 * 256; i++) {
      const div = document.createElement("div");
      div.classList.add("pixel");
      const meta = pixelStatus[i];
      if (!meta) continue;

      if (filter === 'mine' && (!walletAddress || meta.owner.toLowerCase() !== walletAddress)) {
        div.classList.add("filtered");
      } else if (['common', 'rare', 'epic'].includes(filter) && meta.rarity !== filter) {
        div.classList.add("filtered");
      }

      div.onclick = () => {
        if (filter === 'mine' && meta.owner.toLowerCase() !== walletAddress) return;
        if (['common', 'rare', 'epic'].includes(filter) && meta.rarity !== filter) return;
        alert(`Пиксель #${i}\nРедкость: ${meta.rarity}\nСтатус: ${meta.status}`);
      };

      overlay.appendChild(div);
    }
  }

  fetch("pixel_status.json").then(r => r.json()).then(data => {
    pixelStatus = data;
    render();
  });
</script>
</body>
</html>
