
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Tao NFT Gallery</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }
    #main {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: url('https://gateway.pinata.cloud/ipfs/bafkreiehhhdw42a7saeshoiazhpq55246qq5hhflwvdfbrfzvum3nj3nqu') no-repeat center center;
      background-size: contain;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      pointer-events: none;
    }
    .filters {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(0,0,0,0.6);
      padding: 8px;
      border-radius: 6px;
    }
    .filters button {
      margin: 0 4px;
      padding: 5px 10px;
      background: #222;
      color: white;
      border: none;
      cursor: pointer;
    }
    .filters button:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <div class="filters">
    <button onclick="setFilter('all')">Все</button>
    <button onclick="setFilter('common')">Обычные</button>
    <button onclick="setFilter('rare')">Редкие</button>
    <button onclick="setFilter('epic')">Эпические</button>
  </div>
  <div id="main">
    <canvas id="canvas" width="256" height="256"></canvas>
  </div>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let filter = 'all';
    let pixelStatus = {};

    fetch('pixel_status.json')
      .then(res => res.json())
      .then(data => {
        pixelStatus = data;
        drawOverlay();
      });

    function setFilter(f) {
      filter = f;
      drawOverlay();
    }

    function drawOverlay() {
      ctx.clearRect(0, 0, 256, 256);
      for (let y = 0; y < 256; y++) {
        for (let x = 0; x < 256; x++) {
          const i = y * 256 + x;
          const px = pixelStatus[i.toString()];
          if (!px) continue;
          if (filter !== 'all' && px.rarity !== filter) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(x, y, 1, 1);
          }
        }
      }
    }
  </script>
</body>
</html>
