<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Tao NFT Gallery</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: white;
            font-family: sans-serif;
        }
        #controls {
            position: fixed;
            top: 0;
            width: 100%;
            background: #222;
            padding: 10px;
            z-index: 10;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        #canvas-container {
            margin-top: 60px;
            display: flex;
            justify-content: center;
        }
        canvas {
            image-rendering: pixelated;
        }
        .highlight {
            outline: 1px solid yellow;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button onclick="filterPixels('all')">Все</button>
        <button onclick="filterPixels('common')">Обычные</button>
        <button onclick="filterPixels('rare')">Редкие</button>
        <button onclick="filterPixels('epic')">Эпические</button>
        <button onclick="filterPixels('mine')">Мои пиксели</button>
        <button onclick="connectWallet()">Подключить кошелёк</button>
    </div>
    <div id="canvas-container">
        <canvas id="nftCanvas" width="256" height="256"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('nftCanvas');
        const ctx = canvas.getContext('2d');
        const image = new Image();
        image.src = 'tao_nft_canvas_full.png';

        const pixelStatus = {};
        let selectedFilter = 'all';

        image.onload = () => {
            ctx.drawImage(image, 0, 0, 256, 256);
        };

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor(e.clientX - rect.left);
            const y = Math.floor(e.clientY - rect.top);
            const pixelId = `${x}_${y}`;
            const status = pixelStatus[pixelId];

            if (selectedFilter !== 'all' && status !== selectedFilter) return;

            alert(`Пиксель (${x}, ${y})
Статус: ${status || 'обычный'}
[Купить]`);
        });

        function filterPixels(type) {
            selectedFilter = type;
            image.onload();
        }

        async function loadPixelStatus() {
            const res = await fetch('pixel_status.json');
            Object.assign(pixelStatus, await res.json());
        }

        async function connectWallet() {
            alert('Метамаск подключение эмуляция');
        }

        loadPixelStatus();
    </script>
</body>
</html>
