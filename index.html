
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>NFT Pixel Gallery</title>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: sans-serif; }
    #canvasContainer { position: relative; width: 512px; margin: auto; }
    canvas { display: block; }
    .controls { text-align: center; margin: 20px; }
    button { margin: 0 5px; padding: 8px 12px; cursor: pointer; }
    #walletAddress { margin-top: 10px; display: block; color: lime; font-size: 14px; }
  </style>
</head>
<body>
  <div class="controls">
    <button onclick="connectWallet()">🔌 Подключить Metamask</button>
    <button onclick="filterPixels('all')">Все</button>
    <button onclick="filterPixels('common')">Обычные</button>
    <button onclick="filterPixels('rare')">Редкие</button>
    <button onclick="filterPixels('epic')">Эпические</button>
    <button onclick="filterPixels('owned')">Мои пиксели</button>
    <span id="walletAddress"></span>
  </div>

  <div id="canvasContainer">
    <canvas id="canvas" width="256" height="256"></canvas>
    <canvas id="overlay" width="256" height="256" style="position:absolute; left:0; top:0;"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const overlay = document.getElementById("overlay");
    const overlayCtx = overlay.getContext("2d");

    const pixelSize = 1;
    let pixelStatus = {};
    let currentFilter = "all";
    let walletAddress = "";

    async function connectWallet() {
      if (window.ethereum) {
        const accounts = await ethereum.request({ method: "eth_requestAccounts" });
        walletAddress = accounts[0];
        document.getElementById("walletAddress").innerText = "🟢 " + walletAddress;
        filterPixels(currentFilter);
      } else {
        alert("Установите Metamask.");
      }
    }

    function filterPixels(filter) {
      currentFilter = filter;
      drawOverlay();
    }

    function drawOverlay() {
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      for (const id in pixelStatus) {
        const px = pixelStatus[id];
        const [x, y] = id.split("_").map(Number);
        let show = true;

        if (currentFilter === "rare" && px.rarity !== "rare") show = false;
        if (currentFilter === "epic" && px.rarity !== "epic") show = false;
        if (currentFilter === "common" && px.rarity !== "common") show = false;
        if (currentFilter === "owned" && px.owner !== walletAddress) show = false;

        if (!show) {
          overlayCtx.fillStyle = "rgba(0,0,0,0.75)";
          overlayCtx.fillRect(x, y, 1, 1);
        }
      }
    }

    function drawImage() {
      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, 0, 0);
        drawOverlay();
      };
      img.src = "tao_nft_canvas_full.png";
    }

    function fetchStatus() {
      fetch("pixel_status.json")
        .then(res => res.json())
        .then(data => {
          pixelStatus = data;
          drawImage();
        });
    }

    overlay.addEventListener("click", (e) => {
      const rect = overlay.getBoundingClientRect();
      const x = Math.floor((e.clientX - rect.left) / pixelSize);
      const y = Math.floor((e.clientY - rect.top) / pixelSize);
      const id = `${x}_${y}`;
      const px = pixelStatus[id];

      if (!px) return;

      // Только если фильтр совпадает с пикселем
      if (currentFilter !== "all" && currentFilter !== "owned" && px.rarity !== currentFilter) return;
      if (currentFilter === "owned" && px.owner !== walletAddress) return;

      alert(`Вы выбрали пиксель (${x}, ${y})\nРедкость: ${px.rarity}\nСтатус: ${px.status}`);
    });

    fetchStatus();
  </script>
</body>
</html>
