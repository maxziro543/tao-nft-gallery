
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Tao NFT Gallery</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }
    #main {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: url('https://gateway.pinata.cloud/ipfs/bafkreiehhhdw42a7saeshoiazhpq55246qq5hhflwvdfbrfzvum3nj3nqu') no-repeat center center;
      background-size: contain;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(256, 1fr);
      grid-template-rows: repeat(256, 1fr);
    }
    .pixel {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      border: 0.01px solid transparent;
      cursor: pointer;
    }
    .filtered {
      opacity: 0.08;
    }
    .filters {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(0,0,0,0.6);
      padding: 8px;
      border-radius: 6px;
    }
    .filters button {
      margin: 0 4px;
      padding: 5px 10px;
      background: #222;
      color: white;
      border: none;
      cursor: pointer;
    }
    .filters button:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <div class="filters">
    <button onclick="setFilter('all')">Все</button>
    <button onclick="setFilter('common')">Обычные</button>
    <button onclick="setFilter('rare')">Редкие</button>
    <button onclick="setFilter('epic')">Эпические</button>
  </div>
  <div id="main">
    <div id="overlay"></div>
  </div>

  <script>
    const overlay = document.getElementById('overlay');
    let statusData = {};
    let filter = 'all';

    fetch('pixel_status.json')
      .then(res => res.json())
      .then(data => {
        // Обработка разных форматов ключей: "x_y" или "index"
        if (typeof Object.keys(data)[0] === "string" && Object.keys(data)[0].includes("_")) {
          const transformed = {};
          for (const key in data) {
            const [x, y] = key.split("_").map(Number);
            const index = y * 256 + x;
            transformed[index] = data[key];
          }
          statusData = transformed;
        } else {
          statusData = data;
        }
        renderPixels();
      });

    function renderPixels() {
      overlay.innerHTML = '';
      for (let i = 0; i < 256 * 256; i++) {
        const div = document.createElement('div');
        div.classList.add('pixel');
        const meta = statusData[i];
        if (!meta) continue;

        if (filter !== 'all' && meta.rarity !== filter) {
          div.classList.add('filtered');
        }

        div.onclick = () => {
          if (filter === 'all' || meta.rarity === filter) {
            alert(`Пиксель #${i}\nСтатус: ${meta.status}\nРедкость: ${meta.rarity}`);
          }
        };
        overlay.appendChild(div);
      }
    }

    function setFilter(f) {
      filter = f;
      renderPixels();
    }
  </script>
</body>
</html>
